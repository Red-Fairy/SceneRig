[tool.uv.sources]
coacd = { path = "lib/utils/third_party/coacd", editable = false }
moge = { path = "lib/utils/third_party/moge", editable = true }
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
# Mirror the git pins MoGE declares, so resolution is deterministic.
utils3d = { git = "https://github.com/EasternJournalist/utils3d.git", rev = "3fab839f0be9931dac7c8488eb0e1600c236e183" }
pipeline = { git = "https://github.com/EasternJournalist/pipeline.git", rev = "866f059d2a05cde05e4a52211ec5051fd5f276d6" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
# SceneRig runs its own suite (parent pyprojects should ignore this tree, and without this table pytest
# used to climb to kuma's config: python_files="*test.py", which never collected the five
# *_checks.py harness-contract modules — ~190 tests ran only when named; audit 2026-09-15).
testpaths = ["lib", "isaac", "scripts"]
python_files = ["*_test.py", "*_checks.py"]
norecursedirs = ["third_party", ".venv", "output", "outputs", "audits", "dataset", "logs", "run_logs", "*_dist", "__pycache__", "node_modules", ".git"]
markers = ["native: launches bundled Blender/Isaac; run explicitly with -m native"]
addopts = "-m 'not native'"
