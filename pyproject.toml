# Reproducible definition of the SceneRig agent runtime and MoGE-2 stack.
#
# NOTE: the heavy 3D backends the codebase can call (infinigen/Blender, sam3d,
# trellis, nvdiffrast, pytorch3d, kaolin, gsplat, open3d, …) live in SEPARATE
# environments and are intentionally NOT part of this venv.
#
# Rebuild:  uv sync           (run from this directory)
# torch/torchvision are the CUDA 12.8 builds, pulled from the pinned index below.

[dependency-groups]
dev = ["pytest"]

[project]
name = "scenerig"
version = "0.0.0"
description = "SceneRig single-image reconstruction runtime."
requires-python = ">=3.11,<3.12"
dependencies = [
    # MoGE-2 and its geometry dependencies.
    "moge @ git+https://github.com/microsoft/MoGe.git@b942f00",
    # Pinned to CUDA 12.8, compatible with NVIDIA driver 570 and newer.
    "torch==2.11.0",
    "torchvision==0.26.0",
    # Collision-aware convex decomposition for physics colliders.
    "coacd==1.0.7",
    # Agent / LLM + interactive-CLI runtime.
    "mcp==1.28.0",
    "openai==2.43.0",
    # Native Anthropic Messages API used by the default agent runtime.
    "anthropic==0.120.2",
    "cryptography==49.0.0",
    "inquirerpy==0.3.4",
]

[tool.uv]
# Not an installable package itself; the source lives under lib/ (imported with
# the project dir on sys.path), so don't try to build/install this project.
package = false
environments = ["sys_platform == 'linux'"]
# Pin transitive dependencies so `uv sync` remains reproducible.
constraint-dependencies = [
    "annotated-doc==0.0.4",
    "annotated-types==0.7.0",
    "anthropic==0.120.2",
    "anyio==4.14.0",
    "attrs==26.1.0",
    "brotli==1.2.0",
    "certifi==2026.6.17",
    "cffi==2.0.0",
    "charset-normalizer==3.4.7",
    "click==8.4.1",
    # Collision-aware convex decomposition for Isaac settling.
    "coacd==1.0.7",
    "contourpy==1.3.3",
    "cryptography==49.0.0",
    "cycler==0.12.1",
    "distro==1.9.0",
    "fastapi==0.137.2",
    "filelock==3.29.4",
    "fonttools==4.63.0",
    "fsspec==2026.6.0",
    "glcontext==3.0.0",
    "gradio==6.17.3",
    "gradio-client==2.5.0",
    "groovy==0.1.2",
    "h11==0.16.0",
    "hf-gradio==0.4.1",
    "hf-xet==1.5.1",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "httpx-sse==0.4.3",
    "huggingface-hub==0.36.2",
