# Reproducible definition of the ./.venv environment (the SceneRig agent runtime +
# MoGE monocular-geometry stack). This env was previously pip-installed ad-hoc;
# this file lets it be rebuilt/relocated with `uv sync`.
#
# NOTE: the heavy 3D backends the codebase can call (infinigen/Blender, sam3d,
# trellis, nvdiffrast, pytorch3d, kaolin, gsplat, open3d, …) live in SEPARATE
# environments and are intentionally NOT part of this venv.
#
# Rebuild:  uv sync           (run from this directory)
# torch/torchvision are the CUDA 13.0 builds, pulled from the pinned index below.

[dependency-groups]
dev = ["pytest"]

[project]
name = "scenerig"
version = "0.0.0"
description = "SceneRig single-image reconstruction runtime."
requires-python = ">=3.11,<3.12"
dependencies = [
    # Vendored & editable; declares the geometry stack as its own deps (torch,
    # torchvision, trimesh, opencv-python, scipy, matplotlib, numpy, pillow,
    # gradio, huggingface-hub, click, utils3d, pipeline).
    "moge",
    # Pinned to the CUDA 13.0 builds via the pytorch-cu130 index (see sources).
    "torch==2.11.0",
    "torchvision==0.26.0",
    # Collision-aware convex decomposition (settle colliders). Was only in
    # constraint-dependencies below (a pin, not a requirement) so uv sync never
    # installed it — broke settle/certify on prod 2026-07-24.
    "coacd==1.0.7+grase.2",
    # Agent / LLM + interactive-CLI runtime.
    "mcp==1.28.0",
    "openai==2.43.0",
    # Native Anthropic Messages API (GRASE_NATIVE_API=1, the run_e2e.sh default).
    # Was installed but undeclared until 2026-08-06, so a clean `uv sync` broke
    # the default launch path with ModuleNotFoundError at the first agent round.
    "anthropic==0.120.2",
    "cryptography==49.0.0",
    "inquirerpy==0.3.4",
    # CUDA userspace libs installed explicitly (torch only pulls its *-cu13 wheels).
    "cuda-toolkit==13.0.2",
]

[tool.uv]
# Not an installable package itself; the source lives under lib/ (imported with
# the project dir on sys.path), so don't try to build/install this project.
package = false
# Pin every (transitive) package to the versions currently installed in ./.venv
# so `uv sync` reproduces this exact environment instead of drifting to newer
# releases (e.g. a huggingface-hub major bump). Regenerate from `uv pip freeze`.
constraint-dependencies = [
    "annotated-doc==0.0.4",
    "annotated-types==0.7.0",
    "anthropic==0.120.2",
    "anyio==4.14.0",
    "attrs==26.1.0",
    "brotli==1.2.0",
    "certifi==2026.6.17",
    "cffi==2.0.0",
    "charset-normalizer==3.4.7",
    "click==8.4.1",
    # Collision-aware convex decomposition (physics colliders for the Isaac settle).
    "coacd==1.0.7+grase.2",
    "contourpy==1.3.3",
    "cryptography==49.0.0",
    "cuda-bindings==13.3.1",
    "cuda-pathfinder==1.5.5",
    "cuda-toolkit==13.0.2",
    "cycler==0.12.1",
    "distro==1.9.0",
    "fastapi==0.137.2",
    "filelock==3.29.4",
    "fonttools==4.63.0",
    "fsspec==2026.6.0",
    "glcontext==3.0.0",
    "gradio==6.17.3",
    "gradio-client==2.5.0",
    "groovy==0.1.2",
    "h11==0.16.0",
