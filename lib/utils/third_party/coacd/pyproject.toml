[build-system]
requires = [
    "setuptools==75.8.0",
    "wheel==0.45.1",
    "cmake==3.31.6",
    "ninja==1.11.1.4",
]
build-backend = "setuptools.build_meta"

[tool.uv]
# Local directory dependencies otherwise watch only packaging entrypoints.
# These globs cover this small source closure, including native code changes.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "setup.py" },
    { file = "setup.cfg" },
    { file = "MANIFEST.in" },
    { file = "UPSTREAM.json" },
    { file = "README.md" },
    { file = "LICENSE" },
    { file = "CMakeLists.txt" },
    { file = "main.cpp" },
    { file = "src/**/*.h" },
    { file = "src/**/*.hpp" },
    { file = "src/**/*.cpp" },
    { file = "public/*" },
    { file = "cmake/*" },
    { file = "python/package/**/*.py" },
    { file = "python/package/bin/*" },
    { file = "3rd/cdt/LICENSE*" },
    { file = "3rd/cdt/CDT/include/*" },
    { file = "tests/*.cpp" },
    { env = "CC" },
    { env = "CXX" },
    { env = "CMAKE_GENERATOR" },
]
